<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portão Inteligente | Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<header>
    <div class="logo">
        <i class="fa-solid fa-house-lock"></i>
        <h1>Portão Inteligente</h1>
    </div>

    <div class="usuario">
        <i class="fa-solid fa-user"></i>

        <span id="usuario">
            Usuário
        </span>

        <button onclick="sair()">
            Sair
        </button>
    </div>
</header>

<!-- STATUS DO PORTÃO -->
<main class="dashboard">
    <section class="card">
        <i class="fa-solid fa-door-open icone"></i>
        <h2>Status do Portão</h2>
        <p id="statusPortao">
            🔴 Fechado
        </p>
        <button onclick="alterarStatus()">
            Alterar Status
        </button>

        <!-- BOTÃO PAINEL ADMIN -->
        <a href="../admin/admin.html" class="btn-admin">
            <i class="fa-solid fa-user-shield"></i>
            Painel Admin
        </a>
    </section>

    <!-- ESP32 -->
    <section class="card">
        <i class="fa-solid fa-microchip icone"></i>
        <h2>ESP32</h2>
        <p>
            📡 <span id="esp32">Conectado</span>
        </p>
    </section>

    <!-- HISTÓRICO -->
    <section class="card">
        <i class="fa-solid fa-clock-rotate-left icone"></i>
        <h2>Histórico</h2>
        <ul id="historico">
            <li>Sistema iniciado</li>
            <li>Portão Smart</li>
        </ul>
    </section>
</main>

<script src="dashboard.js"></script>

</body>
</html>
