<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portão Inteligente | Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <div class="logo">
            <i class="fa-solid fa-house-lock"></i>
        </div>
        <h1>Criar Conta</h1>
        <p>Cadastre-se para acessar o sistema</p>
        <form id="cadastroForm">
            <!-- Nome -->
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input
                    type="text"
                    id="usuario"
                    placeholder="Nome de usuário"
                    required>
            </div>
            <!-- Senha -->
            <div class="input-box senha-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required>
                <i class="fa-solid fa-eye" id="toggleSenha"></i>
            </div>
            <!-- Confirmar Senha -->
            <div class="input-box senha-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Confirmar senha"
                    required>
            </div>
            <button type="submit">
                Criar Conta
            </button>
        </form>
        <p class="cadastro-link">
            Já possui uma conta
            <a href="login.html">
                Entrar
            </a>
        </p>
        <span class="versao">
            Sistema de Portão Inteligente • v1.0
        </span>
    </div>
</div>

<script src="cadastro.js"></script>

</body>
</html>
