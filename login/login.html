<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portão Smart | Login</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="login-container">
    <div class="login-box">
        <div class="logo">
            <i class="fa-solid fa-house-lock"></i>
        </div>
        <h1>Portão Smart</h1>
        <p>Faça login para acessar o sistema</p>

        <form id="loginform">

            <div class="input-box">
                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Usuário"
                    required>
            </div>

            <div class="input-box senha-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required>

                <i class="fa-solid fa-eye" id="togglesenha"></i>

            </div>

            <button type="submit">
                Entrar
            </button>

            <a href="cadastro.html" class="btn-cadastro">
                Criar Conta
            </a>

        </form>

        <span class="versao">
            Sistema de Portão Inteligente • v1.0
        </span>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
